[project]
name = "keel"
version = "0.1.0"
description = "Keel — an event-sourced, agent-native durable execution runtime, and Crashproof, its conformance harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.112"]
# Reserved for the real provider, keel/providers/anthropic.py, which §27 stages and is not built:
# nothing imports it yet (tests/unit/test_layering.py keeps it that way until the provider lands).
anthropic = ["anthropic>=0.40"]
langgraph = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
]
# The week-2 engine arms (§22.3): each a dependency of its adapter module only, never of `keel`.
dbos = ["dbos>=2.31", "pydantic-ai-slim[dbos]>=2.43"]
temporal = ["temporalio>=1.33", "pydantic-ai-slim[temporal]>=2.43"]

[project.scripts]
keel = "keel.cli.main:main"
crashproof = "crashproof.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel", "crashproof"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
