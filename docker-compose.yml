# Postgres only. Nothing else, ever (Appendix A §11).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports: ["5432:5432"]
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 2s
      timeout: 3s
      retries: 30
