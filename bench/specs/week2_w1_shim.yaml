# week 2, W1 in shim mode (§29.1's artifact): every Windows arm under the day-3 windows, the day-4
# faults and provider_outage. The Restate arm runs the same cells under WSL (week2_*_restate.yaml),
# because restate-sdk has no Windows wheel.
#
# One commit for every row: the run happens in a worktree pinned at the commit that added this file,
# sharded by adapter into separate --out dirs (the README's recipe), so no template database is
# shared between two processes.
workload: tool_chain_1_effect
mode: shim
seeds: {count: 30, base: 7}
max_recoveries: 3
timeout: 60
t_recover_s: 20
verifier: [S1, S2, S3, S4, S5, S6, L1, L2, C1]

variants:
  - {id: EXTERNAL, endpoint_dedup: false, resolution: probe}
  - {id: IDEMPOTENT, endpoint_dedup: true}

triggers:
  # matrix v0: the three kill windows and the zombie
  - before:tool_call
  - after:tool_effect
  - after:tool_return
  - pause_past_ttl@before:tool_call
  # tier1a: the faults that are not kills
  - tool_timeout@before:tool_call
  - tool_500@after:tool_effect
  - tool_delay@after:tool_effect
  - model_500@before:model_call
  - model_timeout@before:model_call
  - sigterm_grace_ok@after:tool_effect
  - sigterm_grace_too_short@after:tool_effect
  # week 2: three consecutive 503s from the provider (§11.5)
  - provider_outage@before:model_call

adapters:
  - name: keel
    key_source: framework             # effect_key
    configs:
      - {id: default}
  - name: langgraph
    key_source: none                  # no documented idempotency-key primitive (§13.6)
    configs:
      - {id: sync,  durability: sync}
      - {id: async, durability: async}
      - {id: exit,  durability: exit}
  - name: dbos
    key_source: framework             # workflow_id:step_id
    configs:
      - {id: native,      agent_code: native}
      - {id: pydantic_ai, agent_code: pydantic_ai}
  - name: temporal
    key_source: framework             # workflow_run_id:activity_id
    configs:
      - {id: pydantic_ai, agent_code: pydantic_ai}
