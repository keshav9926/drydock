# tier1a — the faults that are not kills (§28.4).
#
# A timeout that becomes ambiguity rather than failure, a receiver that applies an effect and then
# fails to say so, and a model that is slow or unavailable. Same workload, same World, same spec
# per cell, same arms. The baselines here are the same eight that matrix v0 already ran, so these
# cells are paired against trials that exist rather than re-measured.
workload: tool_chain_1_effect
mode: shim
seeds: {count: 30, base: 7}
max_recoveries: 3
timeout: 60
t_recover_s: 20
verifier: [S1, S2, S3, S4, S5, L1, L2]

variants:
  - {id: EXTERNAL, endpoint_dedup: false, resolution: probe}
  - {id: IDEMPOTENT, endpoint_dedup: true}

# `tool_timeout` is armed at the receiver: the request is really sent and really applied, and the
# response never comes — which is why EXTERNAL is AMBIGUOUS here and never FAILED.
triggers:
  - tool_timeout@before:tool_call
  - tool_500@after:tool_effect
  - model_500@before:model_call
  - model_timeout@before:model_call

adapters:
  - name: keel
    key_source: framework
    configs:
      - {id: default}
  - name: langgraph
    key_source: none
    configs:
      - {id: sync, durability: sync}
