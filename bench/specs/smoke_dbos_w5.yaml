# Smoke for the DBOS arm — W5 headline, one seed, both `agent_code` rows (§13.7 H7).
#
# The same triggers and human as `w5.yaml`. H7 predicts one gated deploy for DBOS ("durable `recv`,
# thread held") under a kill while parked; `approval_expiry` is the recv timeout from `expires_in`.
workload: approval_gated_deploy
mode: shim
seeds: {count: 1, base: 7}
max_recoveries: 3
timeout: 60
landmark: tool:deploy_service
approval_delay_ms: 500
approval_duplicate_gap_ms: 0  # §11.4 C's second, unkeyed click; see w5.yaml
verifier: [S1, S2, S3, S4, S5, S7, L1, L2]

variants:
  - {id: GATED, endpoint_dedup: false, resolution: probe}

triggers:
  - approval_delay@supervisor
  - approval_expiry@supervisor
  - kill_while_waiting@supervisor
  - kill@after:tool_effect

adapters:
  - name: dbos
    key_source: framework
    configs:
      - {id: native, agent_code: native}
      - {id: pydantic_ai, agent_code: pydantic_ai}
