# week 2: bench/specs/w5_pre.yaml over every Windows arm, LangGraph's exit config included (not run in
# the first W5 pages). Everything above the adapters is that file's, unchanged, so the cells are the
# same cells.
#
# W5-pre — the tier-2 form of approval_gated_deploy (§13.7 H7, §15.11 rule 8).
#
# One line of script differs from `w5.yaml`: the gated node fires an ungated `notify` *before* it
# asks. H7 predicts LangGraph's documented pre-interrupt re-run fires it twice on resume and Keel,
# which memoizes it as its own step, fires it once. Published in the tier-2 band with the doc quote
# beside it, never unioned with the headline: this document was written to exercise a documented
# caveat, not to compare the runtimes on an ordinary task. If the prediction does not hold, that is
# a finding too, and it is marked so.
#
# Fewer triggers on purpose. The baseline cell — no fault at all, just a human who answers — is the
# one H7 is about: whether the wait itself, resumed, re-fires what came before it.
workload: approval_gated_deploy_pre
mode: shim
seeds: {count: 30, base: 7}
max_recoveries: 3
timeout: 60
landmark: tool:deploy_service
approval_delay_ms: 500
approval_duplicate_gap_ms: 0  # §11.4 C's second, unkeyed click; see w5.yaml
verifier: [S1, S2, S3, S4, S5, S7, L1, L2]

variants:
  - {id: GATED, endpoint_dedup: false, resolution: probe}

triggers:
  - approval_delay@supervisor
  - kill_while_waiting@supervisor
adapters:
  - name: keel
    key_source: framework             # effect_key
    configs:
      - {id: default}
  - name: langgraph
    key_source: none                  # no documented idempotency-key primitive (§13.6)
    configs:
      - {id: sync,  durability: sync}
      - {id: async, durability: async}
      - {id: exit,  durability: exit}
  - name: dbos
    key_source: framework             # workflow_id:step_id
    configs:
      - {id: native,      agent_code: native}
      - {id: pydantic_ai, agent_code: pydantic_ai}
  - name: temporal
    key_source: framework             # workflow_run_id:activity_id
    configs:
      - {id: pydantic_ai, agent_code: pydantic_ai}
  - name: restate
    key_source: framework             # str(restate_context().uuid()), drawn outside the run (WSL only)
    configs:
      - {id: pydantic_ai, agent_code: pydantic_ai}
