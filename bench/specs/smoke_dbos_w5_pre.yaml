# Smoke for the DBOS arm — W5-pre (tier-2), one seed, both `agent_code` rows (§13.7 H7).
#
# The same triggers and human as `w5_pre.yaml`: does the ungated `notify` before the wait fire again
# when the wait resumes, or when the process holding it is killed?
workload: approval_gated_deploy_pre
mode: shim
seeds: {count: 1, base: 7}
max_recoveries: 3
timeout: 60
landmark: tool:deploy_service
approval_delay_ms: 500
approval_duplicate_gap_ms: 0
verifier: [S1, S2, S3, S4, S5, S7, L1, L2]

variants:
  - {id: GATED, endpoint_dedup: false, resolution: probe}

triggers:
  - approval_delay@supervisor
  - kill_while_waiting@supervisor

adapters:
  - name: dbos
    key_source: framework
    configs:
      - {id: native, agent_code: native}
      - {id: pydantic_ai, agent_code: pydantic_ai}
