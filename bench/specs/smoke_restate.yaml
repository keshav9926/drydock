# smoke — the Restate arm through matrix v0's windows, one seed (§13.7's Restate row).
#
# Not a published matrix: one seed per cell is a check that every cell runs and lands where it was
# aimed, and a first look at §13.7's predictions — T1 0 dup, T2 1, T3 1, T4 1 after inactivity + abort,
# `tool_500` "backoff" — before anything is spent on n=30. Runs under Linux (WSL2): restate-sdk has no
# Windows wheel and restate-server is a Linux binary. Put `--out` on the Linux filesystem.
workload: tool_chain_1_effect
mode: shim
seeds: {count: 1, base: 7}
max_recoveries: 3
timeout: 60
t_recover_s: 20
verifier: [S1, S2, S3, S4, S5, L1, L2]

variants:
  - {id: EXTERNAL, endpoint_dedup: false, resolution: probe}
  - {id: IDEMPOTENT, endpoint_dedup: true}

triggers:
  - before:tool_call
  - after:tool_effect
  - after:tool_return
  - pause_past_ttl@before:tool_call
  - tool_500@after:tool_effect

adapters:
  # `agent_code` is §13.5's axis; RestateAgent is the only Restate row staged. The key source is
  # `ctx.uuid()` drawn before the tool's run (F1, docs: "stable UUIDs for things like idempotency keys").
  - name: restate
    key_source: framework
    configs:
      - {id: pydantic_ai, agent_code: pydantic_ai}
