# Two jobs, because two of this repository's claims need checking on every commit and they need
# different things to run.
#
# `checks` needs no database at all: the unit suite, the Hypothesis state machine, the 56 white-box
# conformance cells (44 run, 12 N/A with the reason), the golden diff of the demo's printed lines —
# which is §28.7's named mitigation for "a demo that only works on the author's machine" — and every
# published page re-rendered from its committed rows. It installs the LangGraph, DBOS, Temporal and Restate
# extras, because a change to the shared harness that breaks an arm should fail here and not in an
# overnight bench. (The Temporal and Restate arms' unit tests need no server; their server trials are
# opt-in, CRASHPROOF_TEMPORAL_TESTS=1 and CRASHPROOF_RESTATE_TESTS=1. restate-sdk has no Windows wheel,
# so this Linux job is the only place the Restate arm's unit tests run on every commit.)
#
# `integration` needs Postgres, because the five control-plane statements are the one place the
# MemoryJournal tests and the real store could disagree, and a durability claim checked only against
# an in-memory fake is not checked.
#
# Both run the Python the published rows were measured on (every row pins 3.13), from the lockfile
# as committed: `--locked` fails on a pyproject edit nobody re-locked instead of re-resolving it.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --extra dev --extra langgraph --extra dbos --extra temporal --extra restate
      # `KeelMachine` runs its `ci` profile here, from a fixed seed; `deep` is for targeted local runs.
      - name: unit, property and conformance
        env:
          KEEL_PBT_PROFILE: ci
        run: uv run pytest tests/unit tests/property tests/conformance -q --hypothesis-seed=0
      # The conformance cells write their table. If the committed one differs, the code and the
      # published artefact have diverged — which is exactly what a generated file is for.
      - name: the conformance table is current
        run: git diff --exit-code -- bench/keel_conformance/table.md
      # Every page is a pure function of its committed rows. `verify --recheck` needs the trial
      # directories, which are not committed, so on a clone this is the publication check there is:
      # the renderer and the rows still produce exactly the pages that were published.
      - name: every published page re-renders from its rows
        run: |
          uv run python scripts/render_reports.py
          git diff --exit-code -- bench/reports

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked --extra dev --extra dbos
      - name: control-plane statements against a real store
        env:
          KEEL_TEST_DSN: postgresql://keel:keel@localhost:5432/keel
        run: uv run pytest tests/integration -q
